<!doctype html>
<!--
  Endless Cues' sound: a hidden window that only plays what the cue engine
  (core/engine/cue-engine.js, in the main process, through app/main/host.js) tells it to. It holds no show state, so
  if it crashes main makes a new one and the engine's idea of the show is
  untouched; what was sounding stops, and the operator GOes again.

  One HTMLAudioElement per running audio cue, each through its own gain into its
  bus (the show's buses, Settings ▸ Audio; each has a fader, with a ducker's dip after its
  fader), the buses into a master gain and an analyser (the level
  meter) into the AudioContext, whose output device is the one picked in the
  app's settings.
  Elements stream from disk: a whole show of decoded mixes would not fit.

  Except for HOLD: a track with loop sections is played from a decoded buffer when
  one is ready (main sends the bytes of what is playing and what the next GO plays,
  `decode`, and says what to `keep`), because only an AudioBufferSourceNode loops a
  section to the sample. Such a voice reports `mode` exact; if its buffer is not
  decoded yet it streams like any other, and moves over to the buffer when the decode
  lands (a 30 ms crossfade, `upgrade`), so Hold works for it from then on.

  A music cue moves a playing track (`move`): to the sample when it is a buffer voice, the
  place it leaves crossfaded into the place it lands inside the track (each buffer source has
  a stage of its own, a gain and a low shelf for a DJ's bass swap), so the track's level, its
  ducks and its fader are never touched by it.

  Outputs: a bus plays on outputs 1–2 unless the show sends it to another pair (a click to 3–4). Each pair in use
  has its own master gain and limiter (`pairs`), and the pairs are laid side by side into the device's outputs
  (`route`). With every bus on 1–2 the path is the plain stereo one. A bus sent to outputs the device does not
  have is silent (and said): a click must never fall back into the house.

  A sound may have outputs of its own instead (`own.outputs` on its `play`: a row per channel of the sound, a level at
  each output it goes to; `patch`). It then skips its bus's path and goes, channel by channel, into the outputs'
  pairs, so each pair's master and limiter are still the last thing it meets; and its bus still rides it, because
  the bus's level (fader × gate × duck) and its voice-band dip are also kept as two control signals (`ride`) that
  drive a gain and a filter on the way. This is how a file of more than two channels plays with every channel
  somewhere: on a bus it is folded to stereo. Audition (`own.audition`) is the same door: the sound straight into
  one pair, past its bus. An output may be trimmed (`trims`, after the limiter, down only).

  Effects: one reverb and one delay, each fed by a send from any bus (taken after the bus's fader and duck) and
  coming back on a pair of its own choosing. Neither exists until a bus sends to it, and a bus that sends
  nothing has nothing added to it.

  Rate: a sound can play faster or slower. A decoded buffer can only be played like a tape (its pitch moves with
  its rate: AudioBufferSourceNode.playbackRate, sample-exact, and a ramp of it is on the audio clock). Only a
  streamed element can keep its pitch (HTMLMediaElement.preservesPitch, Chromium's time stretcher), so a sound
  that keeps its pitch at a rate other than 1 is never moved over to a buffer, and has no exact loops. Every
  buffer voice has a clock (`clk`) that says where in its file it is at any moment, through a ramp of its rate.

  Lines (core/audio/lanes.js): a sound's volume drawn over its length is a gain stage of its own (`env`); its pan
  (a field, or a line) is a stage after it (`pan`, equal power, unity on both sides at 0); a line over a setting of
  its sound design moves that setting. Every line is read at a place IN THE FILE: 30 times a second each one is
  scheduled for the next 60 ms as straight ramps 10 ms apart, every one at the value drawn where the sound will
  be at that moment (its clock: a buffer's through its rate, a stream's from the element). So a line follows a
  skip, a loop region, a pause and a change of rate with nothing to reschedule, a bend is followed as a curve, and a
  point lands within about 10 ms. A setting of a tool moves at the 30 readings a second (a filter's frequency
  glides between them; a worklet's setting steps).

  Sound design: a sound may be played through a chain of tools of its own (`own.chain` and `own.eq` on its `play`:
  filters, eq, a gate, a compressor, drive, a crusher, a pitch shifter, chorus, tremolo, auto-pan, width, a delay
  and a reverb; core/audio/chain.js is what each is and builds the nodes, on any context). It sits between the
  sound's source and its level (`design`), so a fade, the envelope, a duck and the bus all come after it and none
  of them changes how hard a compressor is driven. A sound with no chain has nothing there: its source plays
  straight into its level. With `tail` on, a stopped or ended sound's reverb and delay ring
  out before its voice is let go (`ring`). `measure` renders the same chain offline, for the test run to read.

  MIDI: this window also holds the computer's MIDI ports (Web MIDI), because a hidden window is the one place
  that has them; the host says what to send and is told what arrives. What must leave on time (timecode, a MIDI
  file) comes stamped with the time it is due, and the stamp is given to the MIDI system, so no timer here or in
  the host decides when a byte goes.

  Timecode as sound (LTC): made and read by AudioWorklets running the same code the tests check
  (core/timecode/timecode.js, loaded below and pasted into the worklets). LTC out goes to one output of the
  device, past the mixer, the master and the limiter.
-->
