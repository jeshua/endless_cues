<!doctype html>
<!--
  Endless Cues' stage: the output window, on the projector or the second screen. Like the audio window, it only
  does what the cue engine (core/engine/cue-engine.js, in the main process, through app/main/stage.js) tells it
  to, and holds no show state: if it is closed, crashes, or its display is unplugged, the engine goes on (the
  sound too), and a new stage is told again what is up (`engine.pictures()`).

  The stage is a raster of the show's own size (1920 × 1080 unless the show says otherwise), scaled to fit this
  window, so a cue's place is in stage pixels whatever the projector is. Each cue on it is one layer: a video
  (muted here: its sound plays in the audio window, on its bus, and `sync` keeps this picture in step with it),
  a still image, a title, or a live camera. A layer has an opacity, a place (from the centre, up and right
  positive), a scale and a rotation, each of which `move` takes somewhere over a time, in a straight line.

  The stage is black wherever nothing is shown, for as long as the window is open. The corner pin (a four-point
  keystone, the show's) bends the whole stage, test pattern included; the blackout covers everything.

  ?test: a test run. No camera is opened (a Camera cue shows a stand-in picture made here).
-->
<meta charset="utf-8">
<title>Endless Cues stage</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #000; overflow: hidden; }
  .cue { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; will-change: transform, opacity; pointer-events: none; }
  .cue > video, .cue > img { flex: none; display: block; }
  .cue.fit > *, .cue.fill > *, .cue.stretch > * { width: 100%; height: 100%; }
  .cue.fit > * { object-fit: contain; }
  .cue.fill > * { object-fit: cover; }
  .cue.stretch > * { object-fit: fill; }
  .cue > .title { flex: none; white-space: pre; line-height: 1.2; }
  .cue.mirror > video { transform: scaleX(-1); }
  #pattern { position: absolute; inset: 0; z-index: 100000; display: none; }
  #blackout { position: absolute; inset: 0; background: #000; z-index: 200000; opacity: 0; pointer-events: none; }
</style>
<div id="stage"><div id="pattern"></div></div>
<div id="blackout"></div>
<script src="stage.js"></script>
