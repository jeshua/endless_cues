name: Native engine for Windows
# ec-audio.exe for the Windows installers (docs/RELEASING.md, "The native audio engine"): built on Windows, because
# building it on a Mac needs Microsoft's libraries. Run by hand before `node bin/release.js win`:
#   gh workflow run native-win.yml --ref main   then   gh run download <run> -n ec-audio-win -D native/dist
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'x86_64-pc-windows-msvc,aarch64-pc-windows-msvc' }
      - run: cargo test --manifest-path native/Cargo.toml
      - shell: bash
        run: |
          for t in x86_64-pc-windows-msvc:x64 aarch64-pc-windows-msvc:arm64; do
            triple=${t%%:*}; arch=${t##*:}
            cargo build --release --manifest-path native/Cargo.toml --target "$triple"
            mkdir -p "out/win-$arch" && cp "native/target/$triple/release/ec-audio.exe" "out/win-$arch/"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ec-audio-win
          path: out
          if-no-files-found: error
          retention-days: 30
