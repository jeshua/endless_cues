[package]
name = "ec-audio"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Endless Cues' native audio engine: plays what the cue engine says, once per sample."
publish = false

[lib]
name = "ec_audio"
path = "src/lib.rs"

[[bin]]
name = "ec-audio"
path = "src/main.rs"

[dependencies]
cpal = "0.15.3"
symphonia = { version = "0.5.4", features = ["all"] }
rubato = "0.16"
rtrb = "0.3"
crossbeam-channel = "0.5"
serde_json = "1"

[dev-dependencies]
assert_no_alloc = "1.1"

# (macOS: the device's own latency, which cpal does not report: see mac.rs)
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { version = "0.11", default-features = false, features = ["audio_unit", "core_audio"] }

# The QA scripts (qa/main.rs): long runs and runs on real devices, by hand
[[example]]
name = "qa"
path = "qa/main.rs"
