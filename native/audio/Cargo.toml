[package]
name = "ec-audio"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Endless Cues' native audio engine: plays what the cue engine says, once per sample."
publish = false

[lib]
name = "ec_audio"
path = "src/lib.rs"

[[bin]]
name = "ec-audio"
path = "src/main.rs"

[dependencies]
cpal = "0.15.3"
symphonia = { version = "0.5.4", features = ["all"] }
rubato = "0.16"
rtrb = "0.3"
crossbeam-channel = "0.5"
serde_json = "1"

[dev-dependencies]
assert_no_alloc = "1.1"
